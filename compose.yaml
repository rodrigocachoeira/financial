# Local development only. Credentials below are throwaway values for the local database.
services:
  app:
    build: .
    # Installs on every start: the node_modules volume outlives image rebuilds, so it must be synced here.
    command: sh -c "node .yarn/releases/yarn-*.cjs install --immutable && node .yarn/releases/yarn-*.cjs dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    # Auth variables come from .env; the database URLs below override it to reach the db service.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://financial:financial@db:5432/financial
      TEST_DATABASE_URL: postgresql://financial:financial@db:5432/financial_test
      # File events do not cross the Windows bind mount; poll instead.
      WATCHPACK_POLLING: "true"
      # Keep Yarn's install state apart from the one the host writes into .yarn/.
      YARN_INSTALL_STATE_PATH: /app/node_modules/.yarn-install-state.gz
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      # Keep Linux-built dependencies and build output inside the container.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Real statements never enter the container.
      - /app/statements
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
      POSTGRES_DB: financial
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node_modules:
  next_cache:
  db_data:
